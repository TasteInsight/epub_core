  - ebook
  - parser
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  archive: ^4.5.2
  html: ^0.15.7
  path: ^1.9.1
  xml: ^7.0.1
dev_dependencies:
  lints: ^6.1.0
  test: ^1.30.0
